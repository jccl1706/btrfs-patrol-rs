[package]
name = "btrfs-patrol"
version = "0.1.0"
edition = "2024"
description = "btrfs snapshot manager and rollback tool for Arch Linux, with a ratatui TUI"
license = "GPL-3.0-or-later"
repository = "https://github.com/jccl1706/btrfs-patrol-rs"
readme = "README.md"
keywords = ["btrfs", "snapshots", "rollback", "arch-linux", "tui"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.1.8"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"
